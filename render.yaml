databases:
  - name: banking-intelligence-postgres
    databaseName: banking_intelligence
    user: banking_admin
    plan: free
    region: oregon

services:
  - type: web
    name: banking-intelligence-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISABLE_SQLALCHEMY_CEXT
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banking-intelligence-postgres
          property: connectionString
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
